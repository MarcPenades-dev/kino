<ion-content>
  <canvas class="stars-canvas" #starsCanvas></canvas>

  <div class="content-wrap ion-padding">
    <div class="logo-container">
      <img src="assets/logo-kino.jpeg" alt="KINO" class="logo-img" />
      <p class="subtitulo">Colaboración Audiovisual</p>
    </div>

    <div class="form-container">
      <div class="campo">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" placeholder="tu@email.com" />
      </div>
      <div class="campo">
        <label>Contraseña</label>
        <input type="password" [(ngModel)]="password" placeholder="••••••••" />
      </div>

      <div *ngIf="error">
        <p class="error-text">{{ error }}</p>
      </div>

      <button class="btn-entrar" (click)="login()">
        <ion-spinner *ngIf="cargando" name="crescent"></ion-spinner>
        <span *ngIf="!cargando">Entrar</span>
      </button>

      <p class="registro-link">
        ¿No tienes cuenta? <span (click)="irARegistro()">Regístrate</span>
      </p>
    </div>
  </div>
</ion-content>
