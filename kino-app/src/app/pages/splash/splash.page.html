<ion-content class="splash-content">
  <div class="splash-container">

    <!-- LOGO -->
    <div class="logo-wrap">
      <div class="logo-ring ring-3"></div>
      <div class="logo-ring ring-2"></div>
      <div class="logo-ring ring-1"></div>
      <div class="logo-img-wrap">
        <img src="assets/logo-kino.jpeg" class="logo-img" alt="KINO" />
      </div>
    </div>

    <!-- BARRA DE CARGA -->
    <div class="loading-wrap">
      <div class="loading-bar">
        <div class="loading-fill" [style.width.%]="progreso"></div>
      </div>
      <p class="loading-text">{{ mensajeCarga }}</p>
    </div>

  </div>
</ion-content>
